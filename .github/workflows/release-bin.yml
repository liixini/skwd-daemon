name: Build & publish binary release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-bin
  cancel-in-progress: true

jobs:
  ffmpeg-runtime:
    runs-on: ubuntu-latest
    container: debian:12-slim
    permissions:
      contents: read
    steps:
      - name: Install build deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates curl git nasm xz-utils zlib1g-dev

      - uses: actions/checkout@v4

      - name: Test private FFmpeg build scripts
        run: packaging/test-ffmpeg-runtime-scripts.sh

      - name: Build portable private FFmpeg runtime
        run: packaging/build-ffmpeg-runtime.sh /tmp/skwd-ffmpeg

      - name: Verify ABI floor and archive runtime
        run: |
          if readelf --version-info /tmp/skwd-ffmpeg/lib/*.so.* \
              | grep -E 'Name: (GLIBC_2\.(3[7-9]|[4-9][0-9])|GLIBC_[3-9])' >/dev/null; then
            echo 'private FFmpeg unexpectedly requires glibc newer than Debian 12' >&2
            exit 1
          fi
          tar -C /tmp -czf skwd-ffmpeg-runtime.tar.gz skwd-ffmpeg

      - uses: actions/upload-artifact@v4
        with:
          name: skwd-ffmpeg-runtime
          path: skwd-ffmpeg-runtime.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    needs: ffmpeg-runtime
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    outputs:
      v: ${{ steps.ver.outputs.v }}
      sha: ${{ steps.tar.outputs.sha }}
    steps:
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git github-cli \
            rust clang pkgconf patchelf \
            ffmpeg zlib alsa-lib libpulse wayland wayland-protocols mesa imagemagick

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compute pkgver
        id: ver
        run: |
          count=$(git rev-list --count HEAD)
          hash=$(git rev-parse --short HEAD)
          v="r${count}.${hash}"
          echo "v=${v}" >> "$GITHUB_OUTPUT"
          echo "Computed pkgver: ${v}"

      - uses: actions/download-artifact@v4
        with:
          name: skwd-ffmpeg-runtime
          path: ${{ runner.temp }}

      - name: Install portable private FFmpeg runtime
        run: tar -xzf "$RUNNER_TEMP/skwd-ffmpeg-runtime.tar.gz" -C /opt

      - name: Build
        env:
          RUSTUP_TOOLCHAIN: stable
          LIBCLANG_PATH: /usr/lib
          FFMPEG_DIR: /opt/skwd-ffmpeg
          SKWD_FFMPEG_PREFIX: /opt/skwd-ffmpeg
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: ${{ github.workspace }}/packaging/link-private-ffmpeg.sh
        run: cargo build --release --locked

      - name: Smoke test
        run: |
          for bin in skwd-daemon skwd skwd-paper skwd-paper-still; do
            test -x "./target/release/$bin" || { echo "missing: $bin"; exit 1; }
            file "./target/release/$bin" | grep -q "ELF 64-bit LSB" || { echo "not ELF: $bin"; exit 1; }
          done
          XDG_CACHE_HOME="$RUNNER_TEMP" \
            LD_LIBRARY_PATH=/opt/skwd-ffmpeg/lib \
            ./target/release/skwd-paper --help >/dev/null

      - name: Assemble tarball
        id: tar
        run: |
          v="${{ steps.ver.outputs.v }}"
          name="skwd-daemon-${v}-x86_64"
          runtime_lib_dir="$name/lib/skwd-daemon"
          mkdir -p "$name/bin" "$runtime_lib_dir" "$name/data/host" "$name/share/licenses/ffmpeg"
          cp target/release/skwd            "$name/bin/"
          cp target/release/skwd-daemon     "$name/bin/"
          cp target/release/skwd-paper      "$name/bin/"
          cp target/release/skwd-paper-still "$name/bin/"
          cp target/release/libsteam_api.so "$runtime_lib_dir/"
          cp -a \
            /opt/skwd-ffmpeg/lib/libavcodec.so* \
            /opt/skwd-ffmpeg/lib/libavformat.so* \
            /opt/skwd-ffmpeg/lib/libavutil.so* \
            /opt/skwd-ffmpeg/lib/libswresample.so* \
            /opt/skwd-ffmpeg/lib/libswscale.so* \
            "$runtime_lib_dir/"
          cp -a /opt/skwd-ffmpeg/share/licenses/ffmpeg/. "$name/share/licenses/ffmpeg/"
          patchelf --set-rpath '$ORIGIN/../lib/skwd-daemon' "$name/bin/skwd-daemon"
          patchelf --set-rpath '$ORIGIN/../lib/skwd-daemon' "$name/bin/skwd-paper"
          find "$runtime_lib_dir" -maxdepth 1 -type f -name '*.so*' \
            -exec patchelf --set-rpath '$ORIGIN' '{}' \;
          cp data/skwd-daemon.service       "$name/data/"
          cp data/host/shell.qml            "$name/data/host/"
          cp LICENSE                        "$name/"

          ldd "$name/bin/skwd-paper" | tee skwd-paper.ldd
          ! grep -q 'not found' skwd-paper.ldd
          test "$(grep -Ec 'lib(avcodec|avformat|avutil|swresample|swscale).* => .*/lib/skwd-daemon/' skwd-paper.ldd)" -eq 5
          paper_dynamic=$(readelf -d "$name/bin/skwd-paper")
          ! grep -Eq 'lib(avdevice|avfilter)' <<< "$paper_dynamic"
          grep -q 'libavcodec.so.63' <<< "$paper_dynamic"
          grep -q 'libavformat.so.63' <<< "$paper_dynamic"
          grep -q 'libavutil.so.61' <<< "$paper_dynamic"
          grep -q 'libswresample.so.7' <<< "$paper_dynamic"
          grep -q 'libswscale.so.10' <<< "$paper_dynamic"
          XDG_CACHE_HOME="$RUNNER_TEMP" "$name/bin/skwd-paper" --help >/dev/null

          tar -czf "${name}.tar.gz" "$name"
          sha=$(sha256sum "${name}.tar.gz" | cut -d' ' -f1)
          echo "${sha}  ${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.ver.outputs.v }}"
          name="${{ steps.tar.outputs.name }}"
          gh release delete "$v" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$v" \
            --title "$v" \
            --notes "Automated binary build for $v" \
            "${name}.tar.gz" "${name}.tar.gz.sha256"

  publish-aur-bin:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render AUR -bin packaging
        env:
          V: ${{ needs.build.outputs.v }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=${V}/" packaging/aur-bin/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" packaging/aur-bin/PKGBUILD

          T=$'\t'
          src="skwd-daemon-${V}.tar.gz::https://github.com/liixini/skwd-daemon/releases/download/${V}/skwd-daemon-${V}-x86_64.tar.gz"
          sed -i \
            -e "s/^${T}pkgver = .*/${T}pkgver = ${V}/" \
            -e "s/^${T}provides = skwd-daemon=.*/${T}provides = skwd-daemon=${V}/" \
            -e "s|^${T}source = .*|${T}source = ${src}|" \
            -e "s/^${T}sha256sums = .*/${T}sha256sums = ${SHA}/" \
            packaging/aur-bin/.SRCINFO

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n' >> ~/.ssh/config

          git clone ssh://aur@aur.archlinux.org/skwd-daemon-bin.git /tmp/aur-bin
          cp packaging/aur-bin/PKGBUILD            /tmp/aur-bin/
          cp packaging/aur-bin/.SRCINFO            /tmp/aur-bin/
          cp packaging/aur-bin/skwd-daemon.install /tmp/aur-bin/

          cd /tmp/aur-bin
          git config user.name "liixini"
          git config user.email "liixini@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "bump pkgver to ${{ needs.build.outputs.v }}"
          git push
