[package]
name = "skwd-paper"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "skwd-paper"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Wayland client + layer-shell
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
smithay-client-toolkit = { version = "0.19", default-features = false, features = [] }
wayland-egl = "0.32"

# EGL - static linkage so we get eglGetProcAddress as a plain extern symbol
khronos-egl = { version = "6", features = ["static"] }

# OpenGL - for offscreen FBO + per-output blit
gl = "0.14"

image = { workspace = true }

ffmpeg-the-third = { git = "https://github.com/shssoichiro/ffmpeg-the-third.git", rev = "47eb652418f56f8010e640946b105cd5614701f7" }

cpal = "0.16"
ringbuf = "0.4"

libc = "0.2"

[lints.rust]
unsafe_code = "allow"
