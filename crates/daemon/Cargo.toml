[package]
name = "skwd-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "skwd-daemon"
path = "src/main.rs"

[dependencies]
skwd-proto = { workspace = true }
tokio = { workspace = true }
nix = { version = "0.29", features = ["signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
rusqlite = { workspace = true }
notify = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
walkdir = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
zbus = { workspace = true }
async-trait = "0.1"
librespot = { version = "0.8", default-features = false, features = ["pulseaudio-backend", "rustls-tls-native-roots", "with-libmdns"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
rand = "0.8"
url = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
futures-util = "0.3"
mpris-server = "0.10"
steamworks = { workspace = true, optional = true }

[features]
default = ["steamworks-browse"]
steamworks-browse = ["dep:steamworks"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[lints]
workspace = true
